
  name: API Response Time Gate

  on:
    pull_request:

  permissions:
    contents: read
    pull-requests: write

  jobs:
    api-response-time-test:
      runs-on: ubuntu-latest

      steps:

        - name: Checkout testapi repository
          uses: actions/checkout@v4

        - name: Clone api-response-time-tester repository
          run: |
            git clone https://github.com/Abhishekbisht28/api-response-time-tester.git

        - name: Setup Java
          uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '17'

        - name: Verify files
          run: |
            ls
            cd api-response-time-tester
            ls

        - name: Run Maven Tests
          run: |
            cd api-response-time-tester
            mvn clean test

        - name: Upload Reports
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: api-report
            path: api-response-time-tester/target/
