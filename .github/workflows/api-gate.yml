
  name: API Response Time Gate

  on:
    pull_request:

  permissions:
    contents: read
    pull-requests: write

  jobs:
    api-response-time-test:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            token: ${{ secrets.GITHUB_TOKEN }}

        - name: Clone api-response-time-tester
          run: |
            git clone https://github.com/Abhishekbisht28/api-response-time-tester.git

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"

        - name: Install dependencies
          run: |
            pip install requests

        - name: Run API Test
          run: |
            python api-response-time-tester/main.py

        - name: Upload Reports
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: api-report
            path: .

